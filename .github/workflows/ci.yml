name: CI

# Runs on every pull request and on pushes to main, so a broken PR shows a
# red check before it's mergeable (enable "Require status checks to pass"
# in branch protection for main to actually block the merge button on it).
on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN: these jobs only ever read the checkout.
# Without this the token inherits the repository default, which can include
# write access — handed to every third-party action in the run.
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # A job-owned local data directory is required: container services cannot
    # provide the host-side ownership proof enforced by the test harness.
    env:
      AURUM_POSTGRES_USER: postgres
      AURUM_POSTGRES_PASSWORD: ""
      AURUM_POSTGRES_HOST: 127.0.0.1
      AURUM_POSTGRES_PORT: 57613
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Provision owned disposable loopback PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
          PG_BIN="$(pg_config --bindir)"
          RUNTIME="$(mktemp -d "$RUNNER_TEMP/aurum-test-postgres-XXXXXX")"
          # Publish cleanup ownership before any partial initialization or start.
          printf 'AURUM_TEST_PG_WORKSPACE=%s\n' "$RUNTIME" >> "$GITHUB_ENV"
          printf 'AURUM_TEST_PG_BIN=%s\n' "$PG_BIN" >> "$GITHUB_ENV"
          "$PG_BIN/initdb" -D "$RUNTIME/data" -U postgres -A trust
          "$PG_BIN/pg_ctl" -D "$RUNTIME/data" -l "$RUNTIME/server.log" \
            -o "-h 127.0.0.1 -p $AURUM_POSTGRES_PORT -k $RUNTIME" -w start
          export RUNTIME
          python - <<'PY'
          import json, os
          from pathlib import Path
          workspace = Path(os.environ["RUNTIME"]).resolve()
          metadata = {"workspace": str(workspace), "data": str(workspace / "data"),
                      "disposable": True, "host": os.environ["AURUM_POSTGRES_HOST"],
                      "port": int(os.environ["AURUM_POSTGRES_PORT"]),
                      "user": os.environ["AURUM_POSTGRES_USER"]}
          (workspace / "runtime.json").write_text(json.dumps(metadata))
          PY
          printf 'AURUM_DISPOSABLE_POSTGRES_RUNTIME=%s/runtime.json\n' "$RUNTIME" >> "$GITHUB_ENV"
      - run: python -m pytest tests unit_tests -q -Werror -rs
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          # runtime.json may not exist if provisioning failed after starting.
          if [ -n "${AURUM_TEST_PG_WORKSPACE:-}" ] && \
             [ -f "$AURUM_TEST_PG_WORKSPACE/data/postmaster.pid" ]; then
            "$AURUM_TEST_PG_BIN/pg_ctl" -D "$AURUM_TEST_PG_WORKSPACE/data" -m fast -w stop
          fi

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b (type-check) then vite build — catches both a broken build
      # and a type error a PR might introduce, same as `npm run build`
      # locally before shipping a change.
      - run: npm run build
      # Vitest over the pure-logic modules (lib/format.ts, the Crypto tab's
      # allocation math) — kept in the same job rather than a new one so a
      # renamed job doesn't silently stop matching branch protection's
      # required status checks.
      - run: npm run test
