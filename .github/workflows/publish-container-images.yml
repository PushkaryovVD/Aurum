name: Publish Aurum container images

on:
  push:
    branches:
      - develop
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/publish-container-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-develop
  cancel-in-progress: false

jobs:
  publish:
    # workflow_dispatch can be launched from another ref in GitHub's UI.
    # Never let that overwrite the mutable develop image tag.
    if: github.ref == 'refs/heads/develop'
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aurum-backend
            context: backend
          - image: aurum-web
            context: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: metadata
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ghcr.io/pushkaryovvd/${{ matrix.image }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
