# Compatibility overlay for existing deployment commands.
#
# Cloudflare Tunnel terminates public HTTPS itself, so Aurum does not need a
# second Caddy/origin-certificate layer. Point cloudflared directly at
# http://127.0.0.1:${AURUM_WEB_PORT:-3000} when it runs on the host, or at the
# host's LAN address when cloudflared runs in another container.
#
# Keeping this file as a no-op means old commands continue to work, while the
# base stack keeps port 3000 published.
services: {}
