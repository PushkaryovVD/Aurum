name: aurum

x-casaos:
  architectures:
    - amd64
  author: Aurum
  category: Finance
  description:
    en_US: Private, self-hosted personal finance workspace.
  developer: Aurum
  icon: https://raw.githubusercontent.com/PushkaryovVD/Aurum/develop/images/aurum-icon.svg
  id: com.pushkaryovvd.aurum
  index: /
  main: web
  port_map: "3000"
  tagline:
    en_US: Know where every dollar comes from and goes.
  title:
    en_US: Aurum
  version: 1.1.8

services:
  auth-key-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        if [ ! -s /run/aurum-secrets/auth_hmac_secret ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /run/aurum-secrets/auth_hmac_secret
        fi
        if [ ! -s /run/aurum-secrets/proxy_shared_secret ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /run/aurum-secrets/proxy_shared_secret
        fi
        chown 10001:10001 /run/aurum-secrets/auth_hmac_secret /run/aurum-secrets/proxy_shared_secret
        chmod 0400 /run/aurum-secrets/auth_hmac_secret /run/aurum-secrets/proxy_shared_secret
    volumes:
      - aurum_auth_secrets:/run/aurum-secrets
    networks:
      - aurum_internal

  db:
    image: postgres:16-alpine
    container_name: aurum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AURUM_POSTGRES_USER:-aurum}
      # "change-me" so this matches .env.example exactly: with no .env at all
      # the fallback here used to be "aurum" while the template said
      # "change-me", i.e. "the default password" meant two different things
      # depending on whether the file existed. Postgres isn't published to the
      # host (no ports: below), so reaching it means already being on the
      # container network — but see .env.example for the trap that makes this
      # worth getting right the first time.
      POSTGRES_PASSWORD: ${AURUM_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${AURUM_POSTGRES_DB:-aurum}
    volumes:
      - aurum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AURUM_POSTGRES_USER:-aurum}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aurum_internal

  backend:
    # CasaOS requires a pullable image/tag even when local Docker Compose also
    # has this source build context available.
    image: ${AURUM_BACKEND_IMAGE:-ghcr.io/pushkaryovvd/aurum-backend:develop}
    container_name: aurum-backend
    build: ./backend
    restart: unless-stopped
    # Nothing here ever needs to gain privileges (no setuid binaries, no sudo),
    # so forbid it outright — this is what stops a compromised process from
    # escalating back to root inside the container.
    security_opt:
      - no-new-privileges:true
    environment:
      AURUM_POSTGRES_USER: ${AURUM_POSTGRES_USER:-aurum}
      # Must stay identical to the db service's fallback above — if the two
      # drift, an install without .env brings up a database with one password
      # and a backend dialling it with another.
      AURUM_POSTGRES_PASSWORD: ${AURUM_POSTGRES_PASSWORD:-change-me}
      AURUM_POSTGRES_DB: ${AURUM_POSTGRES_DB:-aurum}
      AURUM_POSTGRES_HOST: db
      AURUM_POSTGRES_PORT: 5432
      AURUM_CORS_ORIGINS: ${AURUM_CORS_ORIGINS:-}
      AURUM_DEFAULT_CURRENCY: ${AURUM_DEFAULT_CURRENCY:-KZT}
      # Free CoinGecko Demo key (coingecko.com/en/api/pricing) — the Crypto
      # tab's price sync 400s with a clear message until this is set.
      AURUM_COINGECKO_API_KEY: ${AURUM_COINGECKO_API_KEY:-}
      # Dedicated read-only Tradernet key pair. Never enable trading on it.
      AURUM_TRADERNET_API_PUBLIC_KEY: ${AURUM_TRADERNET_API_PUBLIC_KEY:-}
      AURUM_TRADERNET_API_SECRET_KEY: ${AURUM_TRADERNET_API_SECRET_KEY:-}
      AURUM_TELEGRAM_BOT_TOKEN: ${AURUM_TELEGRAM_BOT_TOKEN:-}
      AURUM_TELEGRAM_WEBAPP_URL: ${AURUM_TELEGRAM_WEBAPP_URL:-}
      # Optional invitation e-mail (see .env.example).
      AURUM_SMTP_HOST: ${AURUM_SMTP_HOST:-}
      AURUM_SMTP_PORT: ${AURUM_SMTP_PORT:-587}
      AURUM_SMTP_USERNAME: ${AURUM_SMTP_USERNAME:-}
      AURUM_SMTP_PASSWORD: ${AURUM_SMTP_PASSWORD:-}
      AURUM_SMTP_FROM: ${AURUM_SMTP_FROM:-}
      AURUM_SMTP_SECURITY: ${AURUM_SMTP_SECURITY:-starttls}
      AURUM_PUBLIC_URL: ${AURUM_PUBLIC_URL:-}
      AURUM_ENABLE_DOCS: ${AURUM_ENABLE_DOCS:-true}
      # The develop/test deployment must expose the first-owner ceremony
      # without asking the operator to edit CasaOS environment fields.
      AURUM_APP_AUTH_REQUIRED: ${AURUM_APP_AUTH_REQUIRED:-true}
      # Allows login and first-owner setup over plain HTTP. This is useful for
      # LAN installs and Cloudflare Tunnel, which already provides public TLS.
      AURUM_ALLOW_INSECURE_HTTP: ${AURUM_ALLOW_INSECURE_HTTP:-true}
      AURUM_ENVIRONMENT: ${AURUM_ENVIRONMENT:-development}
      AURUM_AUTH_HMAC_SECRET: ${AURUM_AUTH_HMAC_SECRET:-}
      AURUM_AUTH_HMAC_SECRET_FILE: /run/aurum-secrets/auth_hmac_secret
      AURUM_AUTH_PROXY_SHARED_SECRET_FILE: /run/aurum-secrets/proxy_shared_secret
      # nginx authenticates itself with a generated shared secret, so no
      # deployment-specific bridge address or fixed subnet is required.
      AURUM_AUTH_TRUSTED_PROXY_CIDRS: ${AURUM_AUTH_TRUSTED_PROXY_CIDRS:-}
      AURUM_AUTH_LOOPBACK_CLIENT_CIDRS: ${AURUM_AUTH_LOOPBACK_CLIENT_CIDRS:-127.0.0.0/8,::1/128}
      AURUM_AUTH_SESSION_IDLE_SECONDS: ${AURUM_AUTH_SESSION_IDLE_SECONDS:-1800}
      AURUM_AUTH_SESSION_ABSOLUTE_SECONDS: ${AURUM_AUTH_SESSION_ABSOLUTE_SECONDS:-604800}
      AURUM_AUTH_ARGON2_MEMORY_KIB: ${AURUM_AUTH_ARGON2_MEMORY_KIB:-65536}
      AURUM_AUTH_ARGON2_TIME_COST: ${AURUM_AUTH_ARGON2_TIME_COST:-3}
      AURUM_AUTH_ARGON2_PARALLELISM: ${AURUM_AUTH_ARGON2_PARALLELISM:-4}
      AURUM_AUTH_LOGIN_MAX_ATTEMPTS: ${AURUM_AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AURUM_AUTH_LOGIN_WINDOW_SECONDS: ${AURUM_AUTH_LOGIN_WINDOW_SECONDS:-900}
      AURUM_AUTH_LOGIN_BLOCK_SECONDS: ${AURUM_AUTH_LOGIN_BLOCK_SECONDS:-900}
      AURUM_INITIAL_OWNER_BOOTSTRAP_TTL_SECONDS: ${AURUM_INITIAL_OWNER_BOOTSTRAP_TTL_SECONDS:-900}
    volumes:
      - aurum_auth_secrets:/run/aurum-secrets:ro
    depends_on:
      auth-key-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - aurum_internal

  telegram-bot:
    image: ${AURUM_BACKEND_IMAGE:-ghcr.io/pushkaryovvd/aurum-backend:develop}
    container_name: aurum-telegram-bot
    build: ./backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "app.telegram_bot"]
    environment:
      AURUM_POSTGRES_USER: ${AURUM_POSTGRES_USER:-aurum}
      AURUM_POSTGRES_PASSWORD: ${AURUM_POSTGRES_PASSWORD:-change-me}
      AURUM_POSTGRES_DB: ${AURUM_POSTGRES_DB:-aurum}
      AURUM_POSTGRES_HOST: db
      AURUM_POSTGRES_PORT: 5432
      AURUM_APP_AUTH_REQUIRED: ${AURUM_APP_AUTH_REQUIRED:-true}
      AURUM_ALLOW_INSECURE_HTTP: ${AURUM_ALLOW_INSECURE_HTTP:-true}
      AURUM_AUTH_HMAC_SECRET_FILE: /run/aurum-secrets/auth_hmac_secret
      AURUM_TELEGRAM_BOT_TOKEN: ${AURUM_TELEGRAM_BOT_TOKEN:-}
      AURUM_TELEGRAM_WEBAPP_URL: ${AURUM_TELEGRAM_WEBAPP_URL:-}
    volumes:
      - aurum_auth_secrets:/run/aurum-secrets:ro
    depends_on:
      auth-key-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - aurum_internal
    profiles: ["telegram"]

  web:
    # See backend: CasaOS needs a pullable image reference in addition to build.
    image: ${AURUM_WEB_IMAGE:-ghcr.io/pushkaryovvd/aurum-web:develop}
    container_name: aurum-web
    build: ./frontend
    restart: unless-stopped
    # nginx's master still needs root to bind :80 and to write the htpasswd
    # file at boot (docker-entrypoint.d/20-basic-auth.sh), so this one can't
    # drop to a non-root user without reworking both — but it can still be
    # barred from escalating any further.
    security_opt:
      - no-new-privileges:true
    ports:
      # Publish HTTP on every host interface so LAN clients and a host-level
      # Cloudflare Tunnel can reach the same stable origin port.
      - "${AURUM_BIND_ADDRESS:-0.0.0.0}:${AURUM_WEB_PORT:-3000}:80"
    environment:
      # Both unset = no browser-native Basic Auth perimeter. Aurum's /login and
      # first-owner flow remain controlled independently by the backend.
      AURUM_BASIC_AUTH_USER: ${AURUM_BASIC_AUTH_USER:-}
      AURUM_BASIC_AUTH_PASSWORD: ${AURUM_BASIC_AUTH_PASSWORD:-}
      # Hostnames this instance answers to — anything else gets a 421.
      # See frontend/docker-entrypoint.d/25-allowed-hosts.sh.
      AURUM_ALLOWED_HOSTS: ${AURUM_ALLOWED_HOSTS:-*}
      AURUM_AUTH_PROXY_SHARED_SECRET_FILE: /run/aurum-secrets/proxy_shared_secret
    volumes:
      - aurum_auth_secrets:/run/aurum-secrets:ro
    depends_on:
      - backend
    networks:
      - aurum_internal

volumes:
  aurum_pgdata:
  aurum_auth_secrets:

networks:
  aurum_internal:
