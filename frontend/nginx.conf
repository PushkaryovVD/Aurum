# Rate limit shared by every /api/ request. This file is included from inside
# nginx's http{} block, which is the only context where a zone can be declared.
# Basic Auth has no lockout, no captcha and no delay of its own, so without
# this the single instance password can be guessed at network speed. The rate
# is deliberately well above what the UI needs (a dashboard load fires a
# dozen or so queries at once, and CSV import pages through history) and still
# cuts a brute-force attempt by orders of magnitude.

# Caddy reaches only the un-published internal TLS-proxy port. Never trust a
# browser-supplied X-Forwarded-Proto header on the public plain-HTTP port.
map $server_port $aurum_forwarded_proto {
    8080 https;
    default $scheme;
}

# Port 8080 is a TLS assertion channel, not a general second listener. Only
# Caddy's fixed address on the overlay-only network may use it.
map "$server_port:$remote_addr" $aurum_listener_allowed {
    ~^80: 1;
    "8080:172.31.255.2" 1;
    default 0;
}

# Port 8080 is reachable only from fixed Caddy above; Caddy overwrites this
# header with the actual TLS peer. Public port 80 ignores client headers.
map $server_port $aurum_forwarded_client {
    8080 $http_x_real_ip;
    default $remote_addr;
}

limit_req_zone $aurum_forwarded_client zone=aurum_api:10m rate=20r/s;

# $host normalizes away an explicit non-default port. Preserve the browser's
# original Host header so Origin/CSRF checks see localhost:3000 accurately.
map $http_host $aurum_forwarded_host {
    "" $host;
    default $http_host;
}

server {
    listen 80;
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($aurum_listener_allowed = 0) {
        return 403;
    }

    # Generated at container startup. When configured, protecting the server
    # here makes the initial document request receive nginx's native Basic
    # challenge, so the browser owns the credential prompt and cache.
    include /etc/nginx/basic-auth.conf;

    # Don't advertise the exact nginx version — it turns "is this instance
    # vulnerable to X" into a lookup instead of a probe.
    server_tokens off;

    # Rejects requests whose Host header isn't one we expect (DNS rebinding —
    # see docker-entrypoint.d/25-allowed-hosts.sh, which generates this and
    # explains the attack). Empty file when the check is switched off.
    include /etc/nginx/allowed-hosts.conf;

    # Security headers, applied at server level so every location inherits
    # them. Note for whoever edits this next: adding an add_header inside a
    # location block drops ALL of these for that location — nginx does not
    # merge them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Enforced. This started out as Content-Security-Policy-Report-Only, but
    # Report-Only without a report-uri/report-to endpoint is inert in Firefox
    # — it says so itself in the console: "CSP will not block and cannot
    # report violations of this policy". So an empty console proved nothing,
    # and the choice was between standing up a report-collecting endpoint for
    # a single self-hosted app or enforcing and watching. Enforcing wins: a
    # violation then shows up in every browser's console *and* as a visibly
    # broken element, and rolling back is renaming this one header.
    #
    # Why each part is the way it is:
    #   script-src 'self'       — verified: the built bundle contains no eval/
    #                             new Function, and the theme script was moved
    #                             out of index.html into /theme-init.js.
    #   style-src 'unsafe-inline' — unavoidable for now: 27 components use
    #                             style={{...}} and Recharts injects inline
    #                             styles of its own.
    #   img-src ... coingecko   — coin icons come straight from CoinGecko's
    #                             CDN (thumb_url on a holding); both the
    #                             current and the older asset host are listed.
    #   img-src blob:           — the chart/download paths build blob URLs.
    #   connect-src 'self'      — the API is same-origin; nothing else is called.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://coin-images.coingecko.com https://assets.coingecko.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Always open, no auth — this is what Docker's own HEALTHCHECK and any
    # external uptime monitor hit, and it returns nothing but {"status":"ok"}.
    # docker-entrypoint.d/20-basic-auth.sh writes basic-auth.conf; without an
    # explicit "auth_basic off" here this location would inherit whatever it
    # sets below and healthchecks would start failing with 401.
    location = /api/health {
        auth_basic off;
        # Rate limited too: this is the one unauthenticated route, so it's the
        # one an attacker can hammer for free. Docker's HEALTHCHECK hits it
        # once every 10s, nowhere near the limit.
        limit_req zone=aurum_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/api/health;
        proxy_set_header Host $aurum_forwarded_host;
        proxy_set_header X-Forwarded-Proto $aurum_forwarded_proto;
        include /etc/nginx/proxy-identity.conf;
    }

    # Contains only {"enabled": boolean}; the SPA uses it to retain the
    # unprotected-instance warning. It must stay public when auth is enabled.
    location = /auth-status.json {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Credential and capability endpoints accept only small JSON documents.
    # Keep this proxy-side bound in addition to the backend's streaming limit.
    location ~ ^/api/(auth/session|auth/bootstrap/initial-owner|auth/invitations/accept|workspaces/invitations/accept|workspaces/[^/]+/invitations)$ {
        limit_req zone=aurum_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        client_body_timeout 15s;

        proxy_pass http://backend:8000;
        proxy_set_header Host $aurum_forwarded_host;
        proxy_set_header X-Real-IP $aurum_forwarded_client;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aurum_forwarded_proto;
        include /etc/nginx/proxy-identity.conf;
    }

    # Reverse proxy to the FastAPI backend container. basic-auth.conf is
    # generated at container start (empty if AURUM_BASIC_AUTH_USER/PASSWORD
    # aren't set, so this is a no-op by default) — see docker-entrypoint.d/.
    location /api/ {
        limit_req zone=aurum_api burst=40 nodelay;
        limit_req_status 429;

        # Backup restore posts the whole snapshot as one JSON body, and a
        # real one runs to several MB — nginx's 1m default silently rejected
        # those with a 413 before they ever reached the backend, which meant
        # backups could be taken but not restored. Bounded on purpose rather
        # than disabled (0), so an oversized upload still can't exhaust memory.
        client_max_body_size 64m;
        client_body_timeout 60s;
        # A large restore rewrites every table in one transaction; the default
        # 60s read timeout can cut that off midway.
        proxy_read_timeout 120s;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $aurum_forwarded_host;
        proxy_set_header X-Real-IP $aurum_forwarded_client;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aurum_forwarded_proto;
        include /etc/nginx/proxy-identity.conf;
    }

    # SPA fallback — client-side routing handles the rest. Authentication is
    # inherited from server scope, including the initial HTML and all assets.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
