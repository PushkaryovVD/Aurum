# XcodeGen spec for the native Aurum iOS client.
# The .xcodeproj is generated (`xcodegen generate`) and never committed —
# see ios/README.md. Code signing is intentionally left to the caller: CI
# builds an unsigned archive and the user signs it locally (Sideloadly).
name: Aurum

options:
  bundleIdPrefix: app.aurum
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Aurum:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Aurum
        # Generated below from `info.properties`; referenced via
        # INFOPLIST_FILE, never copied into the bundle as a resource.
        excludes:
          - Info.plist
    info:
      path: Aurum/Info.plist
      properties:
        CFBundleDisplayName: Aurum
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ru
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aurum.finance
        PRODUCT_NAME: Aurum
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES

schemes:
  Aurum:
    build:
      targets:
        Aurum: all
    run:
      config: Debug
    archive:
      config: Release
